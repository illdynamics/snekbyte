name: android-apk-build

on:
  push:
    branches: [main]
    paths:
      - 'android-app/**'
      - 'reference-pwa/**'
      - '.github/workflows/android-build.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-debug-apk:
    name: Build + verify SnekByte debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: android-app/package-lock.json

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Android SDK (official Google cmdline-tools)
        run: |
          set -euo pipefail
          export ANDROID_HOME="$RUNNER_TEMP/android-sdk"
          mkdir -p "$ANDROID_HOME/cmdline-tools"
          curl -sSL -o "$RUNNER_TEMP/clt.zip" \
            https://dl.google.com/android/repository/commandlinetools-linux-13114758_latest.zip
          unzip -q "$RUNNER_TEMP/clt.zip" -d "$ANDROID_HOME/cmdline-tools"
          mv "$ANDROID_HOME/cmdline-tools/cmdline-tools" "$ANDROID_HOME/cmdline-tools/latest"
          # `yes` exits with SIGPIPE once sdkmanager has consumed the
          # license prompts. Disable pipefail only for this pipeline so the
          # normal broken pipe is not reported as an SDK installation failure.
          set +o pipefail
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$ANDROID_HOME" \
            "platform-tools" "platforms;android-35" "build-tools;35.0.0"
          set -o pipefail
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"

      - name: Build debug APK
        working-directory: android-app
        run: |
          # build-debug.sh auto-detects the SDK/JDK from the env set above.
          bash scripts/build-debug.sh

      - name: Verify APK
        run: bash android-app/scripts/verify-apk.sh

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: snekbyte-debug-apk
          path: |
            dist/android/snekbyte-debug.apk
            dist/android/snekbyte-debug.apk.sha256
            dist/android/build-receipt.txt
          if-no-files-found: error

  publish-apk-release:
    name: Publish APK GitHub Release
    needs: build-debug-apk
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Download verified APK artifact
        uses: actions/download-artifact@v4
        with:
          name: snekbyte-debug-apk
          path: release

      - name: Prepare APK release asset
        working-directory: release
        run: |
          set -euo pipefail
          SOURCE_APK="snekbyte-debug.apk"
          ASSET_APK="SnekByte.apk"

          test -s "$SOURCE_APK"
          unzip -l "$SOURCE_APK" | grep -q 'AndroidManifest.xml'
          cp "$SOURCE_APK" "$ASSET_APK"
          sha256sum "$ASSET_APK" > "$ASSET_APK.sha256"

          {
            echo "### SnekByte Android APK"
            echo ""
            echo "- APK: \`$ASSET_APK\`"
            echo "- SHA-256: \`$(awk '{print $1}' "$ASSET_APK.sha256")\`"
            echo "- Source commit: \`${GITHUB_SHA}\`"
            echo ""
            echo "Install with: \`adb install -r $ASSET_APK\`"
          } > RELEASE_NOTES.md

          echo "APK_SHA256=$(awk '{print $1}' "$ASSET_APK.sha256")" >> "$GITHUB_ENV"

      - name: Create or update GitHub Release with APK
        working-directory: release
        run: |
          set -euo pipefail
          TAG="android-v1.0.0-${GITHUB_RUN_NUMBER}"
          TITLE="SnekByte Android APK v1.0.0 (build ${GITHUB_RUN_NUMBER})"

          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit "$TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --title "$TITLE" \
              --notes-file RELEASE_NOTES.md \
              --latest
            gh release upload "$TAG" SnekByte.apk SnekByte.apk.sha256 \
              --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$TAG" \
              SnekByte.apk \
              SnekByte.apk.sha256 \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "$TITLE" \
              --notes-file RELEASE_NOTES.md \
              --latest
          fi

          echo "Released $TAG with SnekByte.apk (sha256: $APK_SHA256)"
